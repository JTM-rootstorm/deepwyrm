[guest_test.bootstrap-registry-launch]
id = 27
state = "implemented"

# DW1-C's selector-specialized four-vCPU normal-preemption gate.
[guest_test.normal-preemption-smp]
id = 28
state = "implemented"

# WYR1-C's selector-29 device-coordinator restart evidence relay. The
# userspace controller owns device identity and lifecycle joins; Deepwyrm
