# Deepwyrm DW0-B/DW0-C host-only guest-harness profile contract.
#
# Wyrmroot owns image construction and produces a separate request manifest
# containing the paired revisions, artifact identities, and destinations.
# This file owns only centralized machine limits and debugger settings.
schema_version = 2

[profile.default]
machine = "q35"
vcpu = 1
memory_mib = 1024
timeout_seconds = 120
gdb_port = 1234

[profile.minimal]
machine = "q35"
vcpu = 1
memory_mib = 256
timeout_seconds = 120
gdb_port = 1234

[profile.smp]
machine = "q35"
vcpu = 4
memory_mib = 2048
timeout_seconds = 180
gdb_port = 1234

[profile.debug]
machine = "q35"
vcpu = 1
memory_mib = 2048
timeout_seconds = 180
gdb_port = 1234

[guest_test.boot-handoff-pass]
id = 1
state = "implemented"

[guest_test.exception-fail-path]
id = 2
state = "implemented"

[guest_test.panic-path]
id = 3
state = "implemented"

# DW0-C memory-foundation gates. These names and IDs are test-build-only
# selector metadata: central tooling supplies only the selector, while the
# kernel build resolves and embeds the unique ID from this file.
[guest_test.memory-mapping]
id = 4
state = "implemented"

[guest_test.memory-unmapping]
id = 5
state = "implemented"

[guest_test.memory-permissions]
id = 6
state = "implemented"

[guest_test.memory-invalid-pointer]
id = 7
state = "implemented"

[guest_test.memory-user-kernel-isolation]
id = 8
state = "implemented"

[guest_test.memory-shared-memory-object]
id = 9
state = "implemented"

# DW0-E7 synthetic CPL3/native-syscall gates. IDs are centralized here; the
# test kernel embeds only the selected identity and production embeds none.
[guest_test.task-syscall-smoke]
id = 10
state = "implemented"

[guest_test.task-syscall-sanitize]
id = 11
state = "reserved"

[guest_test.task-user-exception]
id = 12
state = "reserved"

# DW0-F reserved IPC/blocking identities. F0 reserves these IDs only; target
# dispatch is added later when each selector has a real guest body.
[guest_test.ipc-blocking-smoke]
id = 13
state = "implemented"

[guest_test.ipc-transfer-rollback]
id = 14
state = "reserved"

[guest_test.wait-deadline-timer]
id = 15
state = "reserved"

[guest_test.atomic-wait-wake]
id = 16
state = "implemented"

[guest_test.process-create-bootstrap]
id = 17
state = "reserved"

# DW0-G production-path test builds. Unlike the synthetic F selectors, these
# consume the loader-provided bootstrap and bootfs modules.
[guest_test.primordial-bootstrap]
id = 18
state = "implemented"

[guest_test.primordial-blocking-cleanup]
id = 19
state = "implemented"

[guest_test.primordial-user-exception]
id = 20
state = "implemented"

[guest_test.primordial-invalid-return]
id = 21
state = "implemented"

# DW0-I2 bounded deterministic live stress. This reuses the production
# primordial runtime and the canonical WYR0-H result transport.
[guest_test.smp-runtime-stress]
id = 22
state = "implemented"

# DW0-I1’s test-support-only SMP evidence collector.  This selector embeds a
# build-owned nonce and has no production dispatch until the runtime lane wires
# its semantic scenario hooks.
[guest_test.smp-runtime-acceptance]
id = 23
state = "implemented"

# WYR0-I's test-support-only primordial evidence relay. Wyrmroot remains the
# sole source of WRCAP1 facts; the kernel only validates and relays them.
[guest_test.native-userspace-capability]
id = 24
state = "implemented"

# WYR1-A's test-support-only permanent-supervisor/RRC evidence collector.
# The raw submission trap remains outside the public ABI and exists only in
# the selector-specialized kernel artifact.
[guest_test.permanent-supervisor-rrc]
id = 25
state = "implemented"

# DW1-B's CPU0-only normal-preemption gate. Implementation must add the real
# selector body and structured evidence before changing this state.
[guest_test.normal-preemption-up]
id = 26
state = "reserved"

# WYR1-B's separate bootstrap-registry and supervisor launch/job gate. It is a
# distinct product/evidence contract and does not extend selector 25.
[guest_test.bootstrap-registry-launch]
id = 27
state = "reserved"
