[guest_test.q35-com2-interrupt]
id = 31
state = "implemented"

# WYR1-D's native serial-stream/consoled acceptance product. The paired D0
# contract reserves this identity; no Deepwyrm dispatch exists at E0/D0.
[guest_test.native-console-streams]
id = 32
state = "implemented"

# WYR1-E's selector-private interactive shell certificate relay. The kernel
# validates bounded WRE1 transport and reporter custody only; application
# policy remains in Wyrmroot and the independent host decoder.
[guest_test.interactive-wyrmsh]
id = 33
state = "implemented"

# Reset card R1A's dynamic-launch saturation probe. A selector of its own so it
# inherits no interactive-shell, recovery, or output-pressure geometry; the
