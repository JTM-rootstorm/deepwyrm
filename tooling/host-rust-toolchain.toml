# Trusted host-only Rust identity for tests, Clippy, rustdoc, and xtask.
#
# The accepted Wyrmroot toolchain in rust-toolchain.toml remains the only
# product/target compiler. This installed stable toolchain owns host gates;
# the two lanes must never share a Cargo target directory. These tools come
# from system packages: they are selected by the explicit paths below and are
# checked to be regular files, not pinned by hash.
schema = "deepwyrm-host-rust-toolchain-identity-v1"
cargo_home = ".tmp/cargo-home/offline-v1"
target_dir = ".tmp/cargo-target/host-1.98.1"
tool_bin_directory = "/opt/rust-bin-1.98.1/bin"
cargo_binary = "/opt/rust-bin-1.98.1/bin/cargo"
cargo_version = "cargo 1.98.1 (797e8a9bc 2026-08-05)"
rustc_binary = "/opt/rust-bin-1.98.1/bin/rustc"
rustc_commit = "48a229ceaefd4985c50990b14116b6d856af0985"
rustdoc_binary = "/opt/rust-bin-1.98.1/bin/rustdoc"
rustfmt_binary = "/opt/rust-bin-1.98.1/bin/rustfmt"
cargo_fmt_binary = "/opt/rust-bin-1.98.1/bin/cargo-fmt"
cargo_clippy_binary = "/opt/rust-bin-1.98.1/bin/cargo-clippy"
clippy_driver_binary = "/opt/rust-bin-1.98.1/bin/clippy-driver"
rust_analyzer_binary = "/opt/rust-bin-1.98.1/bin/rust-analyzer"
rust_src_root = "/opt/rust-bin-1.98.1/lib/rustlib/src/rust"
rust_src_std_entry = "/opt/rust-bin-1.98.1/lib/rustlib/src/rust/library/std/src/lib.rs"
rust_src_core_entry = "/opt/rust-bin-1.98.1/lib/rustlib/src/rust/library/core/src/lib.rs"
clang_binary = "/usr/lib/llvm/22/bin/clang-22"
