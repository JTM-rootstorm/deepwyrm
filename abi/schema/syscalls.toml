arg0 = "byte_len|u64|in|NONE|NONE"
arg1 = "flags|u64|in|NONE|NONE"
arg2 = "requested_rights|DwRights|in|NONE|NONE"
arg3 = "out_handle|DwUserAddress|out|NONE|NONE"

[[syscall]]
name = "address_region_map"
number = 0x00020010
phase = "DW0-C"
doc = "Map a memory-object range with explicit W^X-checked protections."
arg0 = "address_region|DwHandle|in|ADDRESS_REGION|MAP+MODIFY"
arg1 = "memory_object|DwHandle|in|MEMORY_OBJECT|MAP"
arg2 = "args|DwUserAddress|in|NONE|NONE"
arg3 = "args_size|u64|in|NONE|NONE"
arg4 = "out_address|DwUserAddress|out|NONE|NONE"

[[syscall]]
name = "address_region_unmap"
number = 0x00020011
phase = "DW0-C"
doc = "Remove mappings from an address region."
arg0 = "address_region|DwHandle|in|ADDRESS_REGION|MODIFY"
arg1 = "address|DwUserAddress|in|NONE|NONE"
arg2 = "byte_len|u64|in|NONE|NONE"

[[syscall]]
name = "address_region_protect"
number = 0x00020012
phase = "DW0-C"
doc = "Change mapping protections while enforcing W^X."
arg0 = "address_region|DwHandle|in|ADDRESS_REGION|MODIFY"
arg1 = "address|DwUserAddress|in|NONE|NONE"
arg2 = "byte_len|u64|in|NONE|NONE"
arg3 = "protections|u64|in|NONE|NONE"

[[syscall]]
name = "channel_create"
number = 0x00030001
phase = "DW0-F"
doc = "Create connected endpoints with nonzero, known, object-compatible requested rights."
arg0 = "requested_rights|DwRights|in|NONE|NONE"
arg1 = "out_endpoint0|DwUserAddress|out|NONE|NONE"
arg2 = "out_endpoint1|DwUserAddress|out|NONE|NONE"

[[syscall]]
name = "channel_send"
number = 0x00030002
phase = "DW0-F"
doc = "Atomically queue bytes and moved handles; each source needs TRANSFER, failures preserve every sender handle, and successful commit transfers object references to the queue."
arg0 = "channel|DwHandle|in|CHANNEL|WRITE"
arg1 = "bytes|DwUserAddress|in|NONE|NONE"
arg2 = "byte_len|u32|in|NONE|NONE"
arg3 = "transfers|DwUserAddress|in|NONE|NONE"
arg4 = "transfer_count|u32|in|NONE|NONE"
arg5 = "flags|u64|in|NONE|NONE"

[[syscall]]
name = "channel_receive"
number = 0x00030003
phase = "DW0-F"
doc = "Receive one atomic datagram; BUFFER_TOO_SMALL consumes nothing and receiver handles are created only on success."
arg0 = "channel|DwHandle|in|CHANNEL|READ"
arg1 = "out_bytes|DwUserAddress|out|NONE|NONE"
arg2 = "byte_capacity|u32|in|NONE|NONE"
arg3 = "out_handles|DwUserAddress|out|NONE|NONE"
arg4 = "handle_capacity|u32|in|NONE|NONE"
arg5 = "out_result|DwUserAddress|out|NONE|NONE"

[[syscall]]
name = "wait_one"
number = 0x00040001
phase = "DW0-F"
doc = "Wait for a nonzero signal mask on one handle."
arg0 = "handle|DwHandle|in|ANY|WAIT"
arg1 = "signals|DwSignals|in|NONE|NONE"
arg2 = "deadline|DwDeadline|in|NONE|NONE"
arg3 = "out_result|DwUserAddress|out|NONE|NONE"

[[syscall]]
name = "wait_many"
number = 0x00040002
phase = "DW0-F"
doc = "WAIT_ANY over a nonempty DwWaitItemV1 array; the lowest ready index is deterministic and WAIT_ALL is reserved."
arg0 = "items|DwUserAddress|in|NONE|NONE"
arg1 = "item_count|u32|in|NONE|NONE"
arg2 = "mode|u32|in|NONE|NONE"
arg3 = "deadline|DwDeadline|in|NONE|NONE"
arg4 = "out_result|DwUserAddress|out|NONE|NONE"

[[syscall]]
name = "event_create"
number = 0x00040010
phase = "DW0-F"
doc = "Create an unsignaled manual-reset event with nonzero, known, object-compatible requested rights."
arg0 = "requested_rights|DwRights|in|NONE|NONE"
arg1 = "out_event|DwUserAddress|out|NONE|NONE"

[[syscall]]
name = "event_signal"
number = 0x00040011
phase = "DW0-F"
doc = "Set or reset a manual event; only SIGNALED is valid, and empty or overlapping clear/set masks are invalid."
arg0 = "event|DwHandle|in|EVENT|SIGNAL"
arg1 = "clear_mask|DwSignals|in|NONE|NONE"
arg2 = "set_mask|DwSignals|in|NONE|NONE"

[[syscall]]
name = "atomic_wait32"
number = 0x00040020
phase = "DW0-F"
doc = "Wait while a validated aligned userspace u32 equals expected; mismatch returns WOULD_BLOCK and callers recheck their atomic predicate after wake."
arg0 = "address|DwUserAddress|in|NONE|NONE"
arg1 = "expected|u32|in|NONE|NONE"
arg2 = "deadline|DwDeadline|in|NONE|NONE"

[[syscall]]
name = "atomic_wake"
number = 0x00040021
phase = "DW0-F"
doc = "Wake up to count waiters on an aligned userspace u32 address; zero is a no-op and DW_ATOMIC_WAKE_ALL wakes every eligible waiter."
arg0 = "address|DwUserAddress|in|NONE|NONE"
arg1 = "count|u32|in|NONE|NONE"
arg2 = "out_woken|DwUserAddress|out|NONE|NONE"

[[syscall]]
name = "clock_get"
number = 0x00050001
phase = "DW0-F"
doc = "Read an explicit clock domain in nanoseconds."
arg0 = "clock_id|DwClockId|in|NONE|NONE"
arg1 = "out_nanoseconds|DwUserAddress|out|NONE|NONE"

[[syscall]]
name = "timer_create"
number = 0x00050010
phase = "DW0-F"
doc = "Create a one-shot monotonic timer with nonzero, known, object-compatible requested rights."
arg0 = "requested_rights|DwRights|in|NONE|NONE"
arg1 = "out_timer|DwUserAddress|out|NONE|NONE"

[[syscall]]
name = "timer_set"
number = 0x00050011
phase = "DW0-F"
doc = "Arm or replace a one-shot timer, atomically clearing prior signal state; INFINITE is invalid and cancel is explicit."
arg0 = "timer|DwHandle|in|TIMER|MODIFY"
arg1 = "deadline|DwDeadline|in|NONE|NONE"

[[syscall]]
name = "timer_cancel"
number = 0x00050012
phase = "DW0-F"
doc = "Cancel a one-shot timer and clear its signaled state."
arg0 = "timer|DwHandle|in|TIMER|MODIFY"
