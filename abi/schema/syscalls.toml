[[record]]
name = "DwAbiInfoV1"
doc = "Kernel ABI and bounded implementation-limit discovery."
field0 = "size|u32|Byte size of this structure."
field1 = "version|u32|Structure version; set to one."
field2 = "abi_version|u32|Native ABI version; zero for DW0."
field3 = "page_size|u32|Base page size in bytes."
field4 = "feature_bits|u64|Open feature bitset; unknown bits remain representable."
field5 = "max_channel_payload|u32|Maximum channel payload bytes."
field6 = "max_channel_handles|u32|Maximum handles per channel message."
field7 = "reserved|[u64;4]|Reserved; all elements must be zero."

[[record]]
name = "DwObjectInfoV1"
doc = "Basic rights-controlled object information returned by object_get_info_v1."
field0 = "size|u32|Byte size of this structure."
field1 = "version|u32|Structure version; set to one."
field2 = "object_type|DwObjectType|Open object-type namespace value."
field3 = "reserved0|u32|Reserved; must be zero."
field4 = "rights|DwRights|Rights held by the queried handle."
field5 = "reserved|[u64;4]|Reserved; all elements must be zero."

[[record]]
name = "DwTaskTerminationInfoV1"
doc = "Structured process or thread termination information."
field0 = "size|u32|Byte size of this structure."
field1 = "version|u32|Structure version; set to one."
field2 = "state|DwTaskState|Current task lifecycle state."
field3 = "reason|DwTerminationReason|Termination classification, or zero before exit."
field4 = "application_code|u32|Application-defined 32-bit normal-exit code."
field5 = "exception_type|DwExceptionType|Structured exception classification when applicable."
field6 = "detail|u32|Reason-specific detail value."
field7 = "reserved0|u32|Reserved; must be zero."
field8 = "fault_address|u64|Faulting address when applicable, otherwise zero."
field9 = "reserved|[u64;3]|Reserved; all elements must be zero."

[[record]]
name = "DwMemoryObjectInfoV1"
doc = "Read-only MemoryObject size information."
field0 = "size|u32|Byte size of this structure."
field1 = "version|u32|Structure version; set to one."
field2 = "byte_size|u64|MemoryObject byte size."
field3 = "reserved|[u64;2]|Reserved; all elements must be zero."

[[record]]
name = "DwProcessCreateArgsV1"
doc = "Arguments for creating a child process and installing its bootstrap channel without a magic handle value."
field0 = "size|u32|Byte size of this structure."
field1 = "version|u32|Structure version; set to one."
field2 = "task_group|DwHandle|Parent task group requiring MODIFY."
field3 = "bootstrap_channel|DwHandle|Channel endpoint requiring TRANSFER and moved into the child only on complete success."
field4 = "process_rights|DwRights|Nonzero rights requested for the returned process handle."
field5 = "root_region_rights|DwRights|Nonzero rights requested for the root address-region handle."
field6 = "child_bootstrap_rights|DwRights|Nonzero subset of source rights installed in the child."
field7 = "flags|u64|Must be zero in ABI 0."
field8 = "reserved|[u64;4]|Reserved; all elements must be zero."

[[record]]
name = "DwProcessCreateResultV1"
doc = "Handles returned after successful process construction."
field0 = "size|u32|Byte size of this structure."
field1 = "version|u32|Structure version; set to one."
field2 = "process|DwHandle|Caller-local process handle."
field3 = "root_address_region|DwHandle|Caller-local root address-region handle."
field4 = "child_bootstrap_handle|DwHandle|Informational child-local value; unusable by the creating process."
field5 = "reserved|[u64;4]|Reserved; all elements must be zero."

[[record]]
name = "DwThreadStartArgsV1"
doc = "Initial user register state for starting a created thread."
field0 = "size|u32|Byte size of this structure."
field1 = "version|u32|Structure version; set to one."
field2 = "thread|DwHandle|Created thread requiring EXECUTE."
field3 = "entry|DwUserAddress|Initial instruction pointer."
field4 = "stack_pointer|DwUserAddress|Initial stack pointer."
field5 = "startup_argument0|u64|First Wyrmroot-owned initial argument value."
field6 = "startup_argument1|u64|Second Wyrmroot-owned initial argument value."
field7 = "flags|u64|Must be zero in ABI 0."
field8 = "reserved|[u64;3]|Reserved; all elements must be zero."

[[record]]
name = "DwHandleTransferV1"
doc = "One handle transaction descriptor for channel_send."
field0 = "handle|DwHandle|Source handle; duplicate source handles in one send are invalid."
field1 = "requested_rights|DwRights|Nonzero subset of rights held by the source handle, which must carry TRANSFER."
field2 = "operation|DwHandleTransferOperation|Must be MOVE in ABI 0."
field3 = "reserved0|u32|Reserved; must be zero."
field4 = "reserved|[u64;2]|Reserved; all elements must be zero."

[[record]]
name = "DwReceivedHandleInfoV1"
doc = "One caller-local handle created by a successful channel_receive."
field0 = "handle|DwHandle|New receiving-process handle."
field1 = "rights|DwRights|Rights carried by the transaction."
field2 = "object_type|DwObjectType|Received kernel object type."
field3 = "reserved0|u32|Reserved; must be zero."
field4 = "reserved|[u64;2]|Reserved; all elements must be zero."

[[record]]
name = "DwChannelReceiveResultV1"
doc = "Actual and required capacities reported by channel_receive."
field0 = "size|u32|Byte size of this structure."
field1 = "version|u32|Structure version; set to one."
field2 = "actual_bytes|u32|Payload bytes copied on success."
field3 = "actual_handles|u32|Handle records created on success."
field4 = "required_bytes|u32|Selected datagram payload size on SUCCESS or BUFFER_TOO_SMALL; unspecified on other failures."
field5 = "required_handles|u32|Selected datagram handle count on SUCCESS or BUFFER_TOO_SMALL; unspecified on other failures."
field6 = "reserved|[u64;4]|Reserved; all elements must be zero."

[[record]]
name = "DwWaitItemV1"
doc = "One handle and nonzero desired signal mask for wait_many."
field0 = "handle|DwHandle|Waitable handle requiring WAIT."
field1 = "signals|DwSignals|Nonzero desired signal mask."

[[record]]
name = "DwWaitResultV1"
doc = "Deterministic wait result; the lowest ready input index wins."
field0 = "size|u32|Byte size of this structure."
field1 = "version|u32|Structure version; set to one."
field2 = "index|u32|Lowest ready input index, or zero for wait_one."
field3 = "reserved0|u32|Reserved; must be zero."
field4 = "observed|DwSignals|Full observed signal state for the selected item."
field5 = "reserved|[u64;3]|Reserved; all elements must be zero."

[[object_info]]
topic = "DW_OBJECT_INFO_BASIC_V1"
accepted_objects = "ANY"
result = "DwObjectInfoV1"
incompatible_status = "WRONG_OBJECT_TYPE"
doc = "Available for every live handle carrying INSPECT."

[[object_info]]
topic = "DW_OBJECT_INFO_TASK_STATE_V1"
accepted_objects = "PROCESS,THREAD"
result = "DwTaskTerminationInfoV1"
incompatible_status = "WRONG_OBJECT_TYPE"
doc = "Reports structured process or thread lifecycle and termination state."

[[object_info]]
topic = "DW_OBJECT_INFO_MEMORY_OBJECT_V1"
accepted_objects = "MEMORY_OBJECT"
result = "DwMemoryObjectInfoV1"
incompatible_status = "WRONG_OBJECT_TYPE"
doc = "Reports the fixed byte size of a MemoryObject."

[[syscall]]
name = "abi_get_info"
number = 0x00000001
phase = "DW0-A"
doc = "Write DwAbiInfoV1 and report required size without relying on a release string."
arg0 = "out_info|DwUserAddress|out|NONE|NONE"
arg1 = "out_size|u64|in|NONE|NONE"
arg2 = "out_required_size|DwUserAddress|out|NONE|NONE"

[[syscall]]
name = "handle_close"
number = 0x00000010
phase = "DW0-D"
doc = "Close one caller-local handle; no right is required beyond possession."
arg0 = "handle|DwHandle|in|ANY|NONE"

[[syscall]]
name = "handle_duplicate"
number = 0x00000011
phase = "DW0-D"
doc = "Create a duplicate with a nonzero rights subset; zero or escalating rights fail."
arg0 = "handle|DwHandle|in|ANY|DUPLICATE"
arg1 = "requested_rights|DwRights|in|NONE|NONE"
arg2 = "out_handle|DwUserAddress|out|NONE|NONE"

[[syscall]]
name = "object_get_info_v1"
number = 0x00000012
phase = "DW0-D"
doc = "Return structured object information; reserved input fields and undersized buffers fail closed."
arg0 = "handle|DwHandle|in|ANY|INSPECT"
arg1 = "topic|u32|in|NONE|NONE"
arg2 = "out_info|DwUserAddress|out|NONE|NONE"
arg3 = "out_size|u64|in|NONE|NONE"
arg4 = "out_required_size|DwUserAddress|out|NONE|NONE"

[[syscall]]
name = "task_group_create"
number = 0x00010001
phase = "DW0-E"
doc = "Create a child task group with nonzero, known, object-compatible requested rights."
arg0 = "parent|DwHandle|in|TASK_GROUP|MODIFY"
arg1 = "requested_rights|DwRights|in|NONE|NONE"
arg2 = "out_handle|DwUserAddress|out|NONE|NONE"

[[syscall]]
name = "task_group_terminate"
number = 0x00010002
phase = "DW0-E"
doc = "Recursively terminate a task group and its descendants."
arg0 = "task_group|DwHandle|in|TASK_GROUP|MODIFY"
arg1 = "reason|u32|in|NONE|NONE"

[[syscall]]
name = "process_create"
number = 0x00010010
phase = "DW0-E"
doc = "Create a process using DwProcessCreateArgsV1 and atomically install its bootstrap channel."
arg0 = "args|DwUserAddress|in|NONE|NONE"
arg1 = "args_size|u64|in|NONE|NONE"
arg2 = "out_result|DwUserAddress|out|NONE|NONE"
arg3 = "result_size|u64|in|NONE|NONE"

[[syscall]]
name = "process_exit"
number = 0x00010011
phase = "DW0-E"
doc = "Exit the calling process normally with a 32-bit application code."
arg0 = "exit_code|u32|in|NONE|NONE"

[[syscall]]
name = "process_terminate"
number = 0x00010012
phase = "DW0-E"
doc = "Explicitly terminate a process with structured reason metadata."
arg0 = "process|DwHandle|in|PROCESS|MODIFY"
arg1 = "reason|u32|in|NONE|NONE"
arg2 = "code|u32|in|NONE|NONE"

[[syscall]]
name = "thread_create"
number = 0x00010020
phase = "DW0-E"
doc = "Create a thread in CREATED state with nonzero, known, object-compatible requested rights."
arg0 = "process|DwHandle|in|PROCESS|MODIFY"
arg1 = "requested_rights|DwRights|in|NONE|NONE"
arg2 = "out_thread|DwUserAddress|out|NONE|NONE"

[[syscall]]
name = "thread_start"
number = 0x00010021
phase = "DW0-E"
doc = "Start a created thread using DwThreadStartArgsV1."
arg0 = "args|DwUserAddress|in|NONE|NONE"
arg1 = "args_size|u64|in|NONE|NONE"

[[syscall]]
name = "thread_exit"
number = 0x00010022
phase = "DW0-E"
doc = "Exit the calling thread normally with a 32-bit code."
arg0 = "exit_code|u32|in|NONE|NONE"

[[syscall]]
name = "thread_terminate"
number = 0x00010023
phase = "DW0-E"
doc = "Explicitly terminate a thread."
arg0 = "thread|DwHandle|in|THREAD|MODIFY"
arg1 = "reason|u32|in|NONE|NONE"
arg2 = "code|u32|in|NONE|NONE"

[[syscall]]
name = "memory_object_create"
number = 0x00020001
