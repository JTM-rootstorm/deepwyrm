[[constant]]
name = "DW_HANDLE_INVALID"
type = "DwHandle"
value = 0
doc = "The only ABI-visible invalid handle value."

[[constant]]
name = "DW_DEADLINE_NOW"
type = "DwDeadline"
value = 0
doc = "Request immediate deadline evaluation."

[[constant]]
name = "DW_DEADLINE_INFINITE"
type = "DwDeadline"
value = 0xffffffffffffffff
doc = "No finite monotonic deadline."

[[constant]]
name = "DW_CHANNEL_MAX_PAYLOAD"
type = "u32"
value = 65536
doc = "Maximum DW0 channel payload bytes."

[[constant]]
name = "DW_CHANNEL_MAX_HANDLES"
type = "u32"
value = 16
doc = "Maximum DW0 channel handles per message."

[[constant]]
name = "DW_WAIT_MANY_MAX_ITEMS"
type = "u32"
value = 64
doc = "Maximum handles accepted by one ABI-0 wait_many operation."

[[constant]]
name = "DW_ATOMIC_WAKE_ALL"
type = "u32"
value = 0xffffffff
doc = "Wake every waiter eligible for atomic_wake."

[[constant]]
name = "DW_HANDLE_TRANSFER_MOVE"
type = "DwHandleTransferOperation"
value = 1
doc = "Move a handle on commit; no duplicate transfer operation exists in ABI 0."

[[constant]]
name = "DW_WAIT_MODE_ANY"
type = "u32"
value = 0
doc = "Return the lowest-index ready item."

[[constant]]
name = "DW_WAIT_MODE_ALL"
type = "u32"
value = 1
doc = "Reserved in ABI 0; operations return NOT_SUPPORTED."

[[constant]]
name = "DW_CLOCK_MONOTONIC_ACTIVE"
type = "DwClockId"
value = 0
doc = "Monotonic active-time clock used by ABI-0 deadlines."

[[constant]]
name = "DW_CLOCK_BOOTTIME"
type = "DwClockId"
value = 1
doc = "Reserved clock domain for future suspend-aware elapsed time."

[[constant]]
name = "DW_OBJECT_INFO_BASIC_V1"
