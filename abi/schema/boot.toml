[[constant]]
name = "DW_BOOT_X86_64_PAGING_HANDOFF_MIN_TABLE_FRAME_COUNT"
type = "u32"
value = 4
doc = "Minimum list count covering the distinct CR3 root and three-child temporary path."

[[constant]]
name = "DW_BOOT_X86_64_PAGING_HANDOFF_MAX_TABLE_FRAME_COUNT"
type = "u32"
value = 256
doc = "Maximum number of transition page-table frames accepted in the V1 carrier."

[[constant]]
name = "DW_BOOT_X86_64_PAGING_HANDOFF_MAX_BYTE_LEN"
type = "u32"
value = 2160
doc = "Maximum exact V1 carrier extent: 112-byte header plus 256 u64 frame addresses."

[[constant]]
name = "DW_BOOT_X86_64_PAGING_HANDOFF_MIN_PHYSICAL_ADDRESS_WIDTH"
type = "u32"
value = 12
doc = "Minimum valid x86_64 physical-address width encoded by the V1 carrier."

[[constant]]
name = "DW_BOOT_X86_64_PAGING_HANDOFF_MAX_PHYSICAL_ADDRESS_WIDTH"
type = "u32"
value = 52
doc = "Maximum valid x86_64 page-table physical-address width encoded by the V1 carrier."

[[constant]]
name = "DW_BOOT_FRAMEBUFFER_V1_VERSION"
type = "u32"
value = 1
