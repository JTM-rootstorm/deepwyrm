[[constant]]
name = "DW_BOOT_X86_64_PAGING_HANDOFF_PD_INDEX"
type = "u16"
value = 0
doc = "Page-directory index derived from the layout-v2 temporary virtual address."

[[constant]]
name = "DW_BOOT_X86_64_PAGING_HANDOFF_PT_INDEX"
type = "u16"
value = 0
doc = "Page-table index derived from the layout-v2 temporary virtual address."

[[constant]]
name = "DW_BOOT_X86_64_PAGING_HANDOFF_TABLE_FRAMES_OFFSET"
type = "u32"
