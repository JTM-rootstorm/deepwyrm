[[record]]
name = "DwBootMemoryRangeV1"
doc = "One normalized physical memory-map entry."
field0 = "size|u32|Byte size of this entry, including any compatible trailing extension."
field1 = "version|u32|Structure version; set to one."
field2 = "kind|DwBootMemoryKind|Normalized memory classification."
field3 = "reserved0|u32|Reserved; producer sets zero and consumer rejects nonzero."
field4 = "physical_start|u64|Physical start address."
field5 = "page_count|u64|Number of 4096-byte pages."
field6 = "firmware_attributes|u64|Raw UEFI memory attributes preserved as opaque bits."
field7 = "reserved|[u64;3]|Reserved; all elements must be zero."

[[record]]
name = "DwBootModuleV1"
doc = "One loaded boot module supplied by the Wyrmroot EFI loader."
field0 = "size|u32|Byte size of this entry, including any compatible trailing extension."
field1 = "version|u32|Structure version; set to one."
field2 = "kind|DwBootModuleKind|Module semantic kind."
field3 = "flags|DwBootModuleFlags|Supported module properties."
field4 = "physical_start|u64|Physical start address of module bytes."
field5 = "byte_len|u64|Exact module byte length."
field6 = "reserved|[u64;4]|Reserved; all elements must be zero."

[[record]]
name = "DwBootX86_64PagingHandoffV1"
doc = "Fixed header for the sole READ_ONLY kernel-internal x86_64 transition-page-table carrier. The containing module's physical_start is 4096-byte aligned, begins with this header, and is followed at table_frames_offset by a flat u64 list. The list is strictly ascending and unique, contains the distinct CR3 root and three temporary-path child frames, and enumerates every current transition page-table frame exactly once with no data frames. Every physical address is nonzero, 4096-byte aligned, has no bits outside physical_address_width, and remains reserved until Deepwyrm replaces CR3. The containing module's byte_len, total_byte_len, and table_frames_offset plus table_frame_count times table_frame_stride must be exactly equal."
field0 = "size|u32|Fixed header byte size; must equal DW_BOOT_X86_64_PAGING_HANDOFF_V1_SIZE."
field1 = "version|u32|Structure version; must equal DW_BOOT_X86_64_PAGING_HANDOFF_V1_VERSION."
field2 = "flags|DwBootX86_64PagingHandoffFlags|Must contain only supported bits; V1 requires zero."
field3 = "physical_address_width|u32|MAXPHYADDR width in bits; must be within the V1 bounds and cover every encoded physical address."
field4 = "cr3_root_physical|u64|Exact current CR3 root-frame physical address with its low 12 bits zero."
field5 = "table_frames_offset|u32|Module-relative list offset; must equal the V1 table-frames-offset constant."
field6 = "table_frame_count|u32|Strictly bounded flat-list count from the V1 minimum through maximum inclusive."
field7 = "table_frame_stride|u32|List element byte stride; must equal the V1 u64 stride constant."
field8 = "total_byte_len|u32|Exact complete carrier extent, including the header and flat list."
field9 = "paging_layout_version|u32|Must equal the accepted Deepwyrm x86_64 paging-layout version."
field10 = "reserved0|u32|Reserved; producer sets zero and consumer rejects nonzero."
field11 = "temporary_virtual_address|u64|Must equal the layout-v2 temporary virtual-address constant."
field12 = "pml4_index|u16|Must equal the PML4 index derived from temporary_virtual_address."
field13 = "pdpt_index|u16|Must equal the PDPT index derived from temporary_virtual_address."
field14 = "pd_index|u16|Must equal the page-directory index derived from temporary_virtual_address."
field15 = "pt_index|u16|Must equal the page-table index derived from temporary_virtual_address."
field16 = "temporary_pdpt_frame_physical|u64|Distinct PML4 child frame selected by pml4_index; low 12 bits must be zero."
field17 = "temporary_pd_frame_physical|u64|Distinct PDPT child frame selected by pdpt_index; low 12 bits must be zero."
field18 = "temporary_pt_frame_physical|u64|Distinct page-directory child frame selected by pd_index; low 12 bits must be zero."
field19 = "reserved|[u64;3]|Reserved; all elements must be zero."

[[record]]
name = "DwBootFramebufferV1"
doc = "Optional linear framebuffer description embedded in DwBootInfoV1."
field0 = "size|u32|Byte size of this descriptor."
field1 = "version|u32|Structure version; set to one."
field2 = "flags|DwBootFramebufferFlags|Supported framebuffer properties."
field3 = "pixel_format|DwBootPixelFormat|Pixel byte/mask layout."
field4 = "physical_start|u64|Physical framebuffer base."
field5 = "byte_len|u64|Mapped framebuffer byte length."
field6 = "width|u32|Visible width in pixels."
field7 = "height|u32|Visible height in pixels."
field8 = "pixels_per_scanline|u32|Pixel stride between scanlines."
field9 = "reserved0|u32|Reserved; must be zero."
field10 = "red_mask|u32|Red channel bit mask for BITMASK format, otherwise zero."
field11 = "green_mask|u32|Green channel bit mask for BITMASK format, otherwise zero."
field12 = "blue_mask|u32|Blue channel bit mask for BITMASK format, otherwise zero."
field13 = "reserved_mask|u32|Reserved channel bit mask for BITMASK format, otherwise zero."
field14 = "reserved|[u64;4]|Reserved; all elements must be zero."

[[record]]
name = "DwBootEntropyV1"
doc = "Optional firmware entropy bytes embedded in DwBootInfoV1."
field0 = "size|u32|Byte size of this descriptor."
field1 = "version|u32|Structure version; set to one."
field2 = "source|DwBootEntropySource|Entropy provenance."
field3 = "flags|DwBootEntropyFlags|Supported entropy properties."
field4 = "physical_start|u64|Physical start address of entropy bytes."
field5 = "byte_len|u64|Number of entropy bytes."
field6 = "reserved|[u64;4]|Reserved; all elements must be zero."

[[record]]
name = "DwBootInfoV1"
doc = "Physical loader-to-kernel handoff produced only after ExitBootServices succeeds."
field0 = "size|u32|Byte size of this structure, including compatible trailing extensions."
field1 = "version|u32|Structure version; set to one."
field2 = "flags|DwBootInfoFlags|Presence and feature flags."
field3 = "memory_map_physical_start|u64|Physical address of the memory-entry table."
field4 = "memory_map_entry_count|u64|Number of memory entries."
field5 = "memory_map_entry_size|u32|Byte stride of each memory entry."
field6 = "reserved0|u32|Reserved; must be zero."
field7 = "modules_physical_start|u64|Physical address of the module-entry table."
field8 = "module_count|u64|Number of module entries."
field9 = "module_entry_size|u32|Byte stride of each module entry."
field10 = "reserved1|u32|Reserved; must be zero."
field11 = "acpi_rsdp_physical_address|u64|Physical RSDP address, or zero when absent."
field12 = "framebuffer|DwBootFramebufferV1|Optional framebuffer descriptor controlled by flags."
field13 = "command_line_physical_start|u64|Physical address of opaque command-line bytes."
field14 = "command_line_byte_len|u64|Number of command-line bytes; no implicit terminator."
field15 = "entropy|DwBootEntropyV1|Optional firmware entropy descriptor; all-zero means absent."
field16 = "reserved|[u64;8]|Reserved; all elements must be zero."
