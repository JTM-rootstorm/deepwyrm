schema_version = 1
abi_name = "Deepwyrm"
abi_version = 0
byte_order = "little"
pointer_width = 64
syscall_instruction = "SYSCALL"
syscall_number_register = "RAX"
syscall_argument_registers = "RDI,RSI,RDX,R10,R8,R9"
syscall_result_register = "RAX"
syscall_clobbers = "RCX,R11"
syscall_result_rule = "DwStatus sign-extended to 64 bits"
rights_input_rule = "Every requested_rights value is nonzero, known, and compatible with the target object type. Duplicate and MOVE transfer requests must be subsets of the named source handle's rights, and the source must carry DUPLICATE or TRANSFER respectively. Creator syscalls mint the requested initial authority for a new object; that authority is bounded by the new object's compatible rights and is authorized by the controlling-handle requirements in syscall metadata, or by the create operation itself when no controlling handle exists. In process_create, MODIFY on the parent task group authorizes minting the returned process and root-region handles, while child_bootstrap_rights may only reduce the transferred Channel handle. Unknown or zero rights are INVALID_ARGUMENT; source-right escalation is ACCESS_DENIED; all failures occur before mutation."

[[newtype]]
name = "DwStatus"
base = "i32"
doc = "Signed native status value; zero is success and negative values are failures."

[[newtype]]
name = "DwHandle"
base = "u64"
doc = "Opaque process-local handle value; only zero has an ABI-visible meaning."

[[newtype]]
name = "DwRights"
base = "u64"
doc = "Bitset of authority held through a handle."

[[newtype]]
name = "DwObjectType"
base = "u32"
doc = "Open numeric namespace identifying a kernel object type."

[[newtype]]
name = "DwSignals"
base = "u64"
doc = "Bitset of observable wait signals."

[[newtype]]
name = "DwUserAddress"
base = "u64"
doc = "Untrusted userspace virtual address transported as a fixed-width scalar."

[[newtype]]
name = "DwDeadline"
base = "u64"
doc = "Absolute monotonic deadline in nanoseconds."

[[newtype]]
name = "DwHandleTransferOperation"
base = "u32"
doc = "Open numeric namespace for channel handle-transfer behavior."

[[newtype]]
name = "DwSyscallId"
base = "u32"
doc = "Explicit native syscall identifier; zero is invalid."

[[newtype]]
name = "DwSize"
base = "u64"
doc = "Fixed-width byte size transported through the native ABI."

[[newtype]]
name = "DwOffset"
base = "u64"
doc = "Fixed-width byte offset transported through the native ABI."

[[newtype]]
name = "DwMemoryProtection"
base = "u32"
doc = "Bitset of requested userspace mapping protections; distinct from handle rights."

[[newtype]]
name = "DwMemoryObjectCreateFlags"
base = "u32"
doc = "Bitset of MemoryObject creation options; ABI 0 supports no nonzero bits."

[[newtype]]
name = "DwAddressRegionMapFlags"
base = "u32"
doc = "Bitset controlling AddressRegion mapping placement."

[[newtype]]
name = "DwClockId"
base = "u32"
doc = "Explicit native clock-domain identifier."

[[newtype]]
name = "DwTaskState"
base = "u32"
doc = "Open numeric namespace for task lifecycle state."

[[newtype]]
name = "DwTerminationReason"
base = "u32"
doc = "Structured task termination reason."

[[newtype]]
name = "DwExceptionType"
base = "u32"
doc = "Structured exception classification; delivery is deferred beyond DW0-A."

[[newtype]]
name = "DwBootInfoFlags"
base = "u64"
doc = "Presence and feature flags for DwBootInfoV1."

[[newtype]]
name = "DwBootMemoryKind"
base = "u32"
doc = "Deepwyrm-owned normalized physical memory classification."

[[newtype]]
name = "DwBootModuleKind"
base = "u32"
doc = "Open numeric namespace identifying a loaded boot module."

[[newtype]]
name = "DwBootModuleFlags"
base = "u32"
doc = "Properties of a loaded boot module."

[[newtype]]
name = "DwBootX86_64PagingHandoffFlags"
base = "u32"
doc = "Flags for the kernel-internal x86_64 paging-handoff carrier; ABI V1 supports no nonzero bits."

[[newtype]]
name = "DwBootFramebufferFlags"
base = "u32"
doc = "Properties of a framebuffer descriptor."

[[newtype]]
name = "DwBootPixelFormat"
base = "u32"
doc = "Open numeric namespace for framebuffer pixel layout."

[[newtype]]
name = "DwBootEntropySource"
base = "u32"
doc = "Open numeric namespace identifying firmware entropy provenance."

[[newtype]]
name = "DwBootEntropyFlags"
base = "u32"
doc = "Properties of a firmware entropy descriptor."
