name: DW0-A host validation

'on':
  push:
  pull_request:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.96.1

jobs:
  host-abi:
    name: Validate workspace and native ABI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install the DW0-A host Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" \
            --profile minimal \
            --component clippy,rustfmt
          rustup default "${RUST_TOOLCHAIN}"

      - name: Validate required sources
        shell: bash
        run: |
          set -euo pipefail

          readonly required_files=(
            Plans/ARCHITECTURE_INDEX.md
            Plans/DEEPWYRM_PRE_PHASE0_INVARIANTS.md
            Plans/DW0_IMPLEMENTATION_PLAN.md
            abi/schema/abi.toml
            abi/schema/syscalls.toml
            tools/abi-gen/Cargo.toml
            crates/deepwyrm-abi/Cargo.toml
            docs/DW0_A_VALIDATION.md
            security/DW0_A_SECURITY_REVIEW.md
          )

          for path in "${required_files[@]}"; do
            if [[ ! -s "${path}" ]]; then
              printf 'missing or empty DW0-A source: %s\n' "${path}" >&2
              exit 1
            fi
          done

      - name: Report host tools
        run: cargo xtask toolchain

      - name: Verify formatting
        run: cargo xtask format

      - name: Reject generated ABI drift
        run: cargo xtask abi check

      - name: Run focused ABI host tests
        run: cargo xtask test host abi

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets

      - name: Reject lint warnings
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Reject rustdoc warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
